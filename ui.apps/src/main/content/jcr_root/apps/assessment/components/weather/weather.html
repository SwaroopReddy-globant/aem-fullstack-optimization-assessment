<sly data-sly-use.weatherModel="com.assessment.core.models.WeatherModel"></sly>

<div class="cmp-weather" data-city="${weatherModel.city}">

    <h2>${weatherModel.pageTitle}</h2>
    <h3>City: ${weatherModel.city}</h3>

    <div>Endpoint: ${weatherModel.endpoint}</div>
    <div>ApiKey: ${weatherModel.apiKey}</div>

    <div class="cmp-weather__server">
        <pre>${weatherModel.weatherJson @ context='unsafe'}</pre>
    </div>

</div>
